<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>좌석 배치도 — RailLog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #1a1a1a; }

    header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 13px; color: #185FA5; text-decoration: none; }
    .back-btn:hover { text-decoration: underline; }
    .header-info { flex: 1; }
    header h1 { font-size: 16px; font-weight: 600; }
    header .sub { font-size: 12px; color: #888; margin-top: 2px; }
    .header-badge { font-size: 11px; padding: 3px 10px; border-radius: 10px; background: #E6F1FB; color: #0C447C; }

    .container { max-width: 820px; margin: 0 auto; padding: 20px 16px; }

    .formation-label { font-size: 11px; color: #aaa; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .cars-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; align-items: stretch; }
    .cars-scroll::-webkit-scrollbar { height: 4px; }
    .cars-scroll::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .car-btn { flex-shrink: 0; min-width: 64px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; text-align: center; font-size: 12px; transition: all .15s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .car-btn:hover { border-color: #185FA5; background: #f5f9ff; }
    .car-btn.active { border-color: #185FA5; background: #E6F1FB; font-weight: 500; }
    .car-btn.active.green-car { border-color: #3B6D11; background: #EAF3DE; }
    .car-btn-num { font-weight: 600; font-size: 13px; }
    .car-btn-type { font-size: 10px; color: #888; }
    .car-btn.active .car-btn-type { color: #185FA5; }
    .car-btn.active.green-car .car-btn-type { color: #3B6D11; }
    .car-dots { display: flex; gap: 1px; flex-wrap: wrap; justify-content: center; max-width: 48px; }
    .car-dot { width: 5px; height: 4px; border-radius: 1px; background: #e0e0e0; }
    .car-dot.g { background: #97C459; }
    .car-dot.p { background: #AFA9EC; }
    .car-dot.b { background: #F09595; }
    .car-dot.n { background: #c8d8f0; }

    .direction-bar { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 8px; }

    .seat-panel { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; }
    .seat-panel-header { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .seat-panel-title { font-size: 15px; font-weight: 600; }
    .class-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .badge-ordinary_reserved { background: #E6F1FB; color: #0C447C; }
    .badge-non_reserved { background: #FFF3E0; color: #7A4000; }
    .badge-green { background: #EAF3DE; color: #27500A; }
    .seat-panel-meta { font-size: 12px; color: #888; margin-bottom: 16px; }

    .col-labels { display: flex; padding-left: 24px; margin-bottom: 4px; }
    .col-label { width: 32px; text-align: center; font-size: 11px; color: #aaa; margin: 0 2px; }
    .col-aisle { width: 16px; }

    .seat-grid { display: flex; flex-direction: column; gap: 4px; }
    .seat-row { display: flex; align-items: center; }
    .row-num { width: 20px; font-size: 10px; color: #bbb; text-align: right; padding-right: 4px; flex-shrink: 0; }
    .aisle { width: 16px; flex-shrink: 0; }
    .seat-empty { width: 32px; height: 28px; margin: 0 2px; flex-shrink: 0; background: transparent; }
    .seat { width: 32px; height: 28px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; transition: transform .1s; margin: 0 2px; flex-shrink: 0; }
    .seat:hover { transform: scale(1.1); }
    .seat.recommend { background: #EAF3DE; color: #27500A; border-color: #97C459; }
    .seat.avoid     { background: #FCEBEB; color: #791F1F; border-color: #F09595; }
    .seat.priority  { background: #EEEDFE; color: #3C3489; border-color: #AFA9EC; }
    .seat.special   { background: #E0F4FF; color: #0C4A6E; border-color: #7DD3FC; }
    .seat.view      { background: #FFF8E1; color: #7A5800; border-color: #FFD54F; }
    .seat.normal    { background: #F5F5F5; color: #888;    border-color: #E0E0E0; }
    .seat.selected  { outline: 2px solid #185FA5; outline-offset: 1px; }

    .seat-info { margin-top: 16px; padding: 14px; background: #F8F9FA; border-radius: 8px; min-height: 60px; }
    .seat-info-title { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .seat-info-badge { font-size: 11px; padding: 1px 7px; border-radius: 8px; }
    .seat-info-note { font-size: 13px; color: #555; line-height: 1.6; }
    .seat-info-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .tag { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: #eee; color: #666; }

    /* 편의시설 */
    .facilities { display: flex; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee; flex-wrap: wrap; }
    .fac { font-size: 12px; color: #666; display: flex; align-items: center; gap: 4px; padding: 3px 8px; background: #f8f9fa; border-radius: 6px; }

    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; }
    .leg-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

    .recommendations { margin-top: 20px; }
    .rec-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #1a1a1a; }
    .rec-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
    .rec-card-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .rec-card-desc { font-size: 12px; color: #888; }

    .loading { text-align: center; padding: 60px 0; color: #888; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <a class="back-btn" href="index.html">← 뒤로</a>
  <div class="header-info">
    <h1 id="trainName">불러오는 중...</h1>
    <div class="sub" id="trainSub"></div>
  </div>
  <span class="header-badge" id="trainCategory"></span>
</header>

<div class="container">
  <div class="formation-label">
    <span id="dirLeft">←</span>
    <span id="dirRight">→</span>
  </div>
  <div class="cars-scroll" id="carsScroll"></div>
  <div class="seat-panel" id="seatPanel">
    <div class="loading">불러오는 중...</div>
  </div>
  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:#EAF3DE;border:1px solid #97C459"></div>추천석</div>
    <div class="leg"><div class="leg-dot" style="background:#FCEBEB;border:1px solid #F09595"></div>비추천석</div>
    <div class="leg"><div class="leg-dot" style="background:#EEEDFE;border:1px solid #AFA9EC"></div>우선석</div>
    <div class="leg"><div class="leg-dot" style="background:#E0F4FF;border:1px solid #7DD3FC"></div>특수석</div>
    <div class="leg"><div class="leg-dot" style="background:#FFF8E1;border:1px solid #FFD54F"></div>전망석</div>
    <div class="leg"><div class="leg-dot" style="background:#F5F5F5;border:1px solid #E0E0E0"></div>일반석</div>
  </div>
  <div class="recommendations" id="recommendations"></div>
</div>

<script>
const params  = new URLSearchParams(location.search);
const trainId = params.get('id') || 'shin_komachi';
let trainData = null;
let selectedEl = null;

function buildSeatMap(car) {
  const map = {};
  (car.seat_notes || []).forEach(note => {
    note.rows.forEach(r => {
      note.cols.forEach(c => {
        map[`${r}-${c}`] = {
          type:  note.type,
          title: note.title?.ko || '',
          note:  note.note?.translations?.ko || '',
          tags:  note.tags || []
        };
      });
    });
  });
  return map;
}

function dotClass(type) {
  return { recommend:'g', avoid:'b', priority:'p', special:'p', view:'g', normal:'n' }[type] || 'n';
}

function renderCars(cars, activeNum) {
  const html = cars.map(car => {
    const classId = car.class_id || 'ordinary_reserved';
    const isGreen = classId === 'green';
    const label   = { ordinary_reserved:'지정석', non_reserved:'자유석', green:'그린카' }[classId] || classId;
    const seatMap = buildSeatMap(car);

    const dotSample = [];
    if (car.seat_rows > 0) {
      for (let r = 1; r <= Math.min(car.seat_rows, 3); r++) {
        (car.seat_columns || ['A','B','C','D']).forEach(c => {
          const info = seatMap[`${r}-${c}`];
          dotSample.push(`<div class="car-dot ${info ? dotClass(info.type) : 'n'}"></div>`);
        });
      }
    }

    return `<button class="car-btn${isGreen ? ' green-car' : ''}${car.number === activeNum ? ' active' : ''}"
      onclick="selectCar(${car.number})">
      <div class="car-btn-num">${car.number}호차</div>
      <div class="car-dots">${dotSample.join('')}</div>
      <div class="car-btn-type">${label}</div>
    </button>`;
  });
  document.getElementById('carsScroll').innerHTML = html.join('');
}

function selectCar(num) {
  const car = trainData.cars.find(c => c.number === num);
  if (!car) return;
  renderCars(trainData.cars, num);
  renderSeatPanel(car);
}

// seat_map에서 실제 좌석 컬럼 목록 추출 (aisle 제외, 중복 제거, 순서 유지)
function getUniqueCols(seatMap2d) {
  const seen = new Set();
  const cols = [];
  seatMap2d.forEach(row => {
    row.forEach(cell => {
      if (cell !== 'aisle' && cell !== 'empty' && !seen.has(cell)) {
        seen.add(cell);
        cols.push(cell);
      }
    });
  });
  return cols;
}

function renderSeatPanel(car) {
  const seatMap   = buildSeatMap(car);
  const classId   = car.class_id || 'ordinary_reserved';
  const classInfo = (trainData.seat_classes || []).find(sc => sc.id === classId) || {};
  const label     = classInfo.display_name?.ko || classId;
  const pitch     = classInfo.pitch_mm ? classInfo.pitch_mm + 'mm' : '-';

  // seat_map이 있으면 사용, 없으면 기본 2+2 생성
  const seatMap2d = car.seat_map && car.seat_map.length > 0
    ? car.seat_map
    : Array(car.seat_rows || 1).fill(['A', 'B', 'aisle', 'C', 'D']);

  // 열 라벨 — 첫 번째 행 기준
  const firstRow = seatMap2d[0] || [];
  let colLabels = '<div class="col-labels"><div style="width:24px"></div>';
  firstRow.forEach(cell => {
  if (cell === 'aisle') {
    colLabels += '<div class="col-aisle"></div>';
  } else if (cell === 'empty') {
    // empty는 라벨 없이 빈 공간만
    colLabels += '<div class="col-label" style="visibility:hidden">-</div>';
  } else {
    colLabels += `<div class="col-label">${cell}</div>`;
  }
});
  colLabels += '</div>';

  // 좌석 그리드
  let grid = '<div class="seat-grid">';
  seatMap2d.forEach((rowDef, rowIdx) => {
    const r = rowIdx + 1;
    grid += '<div class="seat-row">';
    grid += `<div class="row-num">${r}</div>`;

    rowDef.forEach(cell => {
      if (cell === 'aisle') {
        grid += '<div class="aisle"></div>';
      } else if (cell === 'empty') {
        grid += '<div class="seat-empty"></div>';
      } else {
        const key  = `${r}-${cell}`;
        const info = seatMap[key] || { type: 'normal', title: '', note: '', tags: [] };
        const dataNote  = (info.note  || '').replace(/"/g, '&quot;');
        const dataTitle = (info.title || '').replace(/"/g, '&quot;');
        const dataTags  = JSON.stringify(info.tags || []).replace(/"/g, '&quot;');
        grid += `<div class="seat ${info.type}" id="seat-${r}-${cell}"
          data-row="${r}" data-col="${cell}" data-type="${info.type}"
          data-title="${dataTitle}" data-note="${dataNote}" data-tags="${dataTags}"
          onclick="selectSeat(this)">${r}${cell}</div>`;
      }
    });
    grid += '</div>';
  });
  grid += '</div>';

  // 편의시설 — 기본 + 추가 필드 (AED, handwash, conductor_room)
  const f = car.facilities || {};
  const facs = [];
  if (f.toilet)             facs.push({ icon:'🚻', label:'화장실' });
  if (f.toilet_for_man)     facs.push({ icon:'🚹', label:'남성 화장실' });
  if (f.washroom)           facs.push({ icon:'🚿', label:'세면대' });
  if (f.handwash)           facs.push({ icon:'🧴', label:'손세면대' });
  if (f.multi_purpose_room) facs.push({ icon:'♿', label:'다목적실' });
  if (f.wheelchair_space)   facs.push({ icon:'♿', label:'휠체어 공간' });
  if (f.power_outlet)       facs.push({ icon:'🔌', label:'콘센트' });
  if (f.wifi)               facs.push({ icon:'📶', label:'Wi-Fi' });
  if (f.vending_machine)    facs.push({ icon:'🥤', label:'자판기' });
  if (f.smoking_room)       facs.push({ icon:'🚬', label:'흡연실' });
  if (f.AED)                facs.push({ icon:'❤️‍🩹', label:'AED' });
  if (f.conductor_room)     facs.push({ icon:'👨‍✈️', label:'차장실' });
  if (f.luggage_area && f.luggage_area !== 'none') facs.push({ icon:'🧳', label:'짐칸' });

  const badgeClass = {
    ordinary_reserved: 'badge-ordinary_reserved',
    non_reserved:      'badge-non_reserved',
    green:             'badge-green'
  }[classId] || 'badge-ordinary_reserved';

  document.getElementById('seatPanel').innerHTML = `
    <div class="seat-panel-header">
      <span class="seat-panel-title">${car.number}호차</span>
      <span class="class-badge ${badgeClass}">${label}</span>
    </div>
    <div class="seat-panel-meta">좌석 피치 ${pitch} · ${car.capacity || '-'}석</div>
    ${colLabels}
    ${grid}
    <div class="seat-info" id="seatInfo">
      <span style="color:#aaa;font-size:13px">좌석을 클릭하면 상세 정보가 표시됩니다</span>
    </div>
    <div class="facilities">${facs.map(f => `<div class="fac">${f.icon} ${f.label}</div>`).join('')}</div>
  `;
}

function selectSeat(el) {
  if (selectedEl) selectedEl.classList.remove('selected');
  selectedEl = el;
  el.classList.add('selected');

  const row   = el.dataset.row;
  const col   = el.dataset.col;
  const type  = el.dataset.type;
  const title = el.dataset.title;
  const note  = el.dataset.note;
  let tags = [];
  try { tags = JSON.parse(el.dataset.tags.replace(/&quot;/g, '"')); } catch(e) {}

  const typeLabel = { recommend:'추천석', avoid:'비추천석', priority:'우선석', special:'특수석', view:'전망석', normal:'일반석' };
  const typeBg    = {
    recommend: ['#EAF3DE', '#27500A'],
    avoid:     ['#FCEBEB', '#791F1F'],
    priority:  ['#EEEDFE', '#3C3489'],
    special:   ['#E0F4FF', '#0C4A6E'],
    view:      ['#FFF8E1', '#7A5800'],
    normal:    ['#F5F5F5', '#888']
  };
  const [bg, color] = typeBg[type] || ['#F5F5F5', '#888'];

  const tagMap = {
    mountain_view:'🏔 산 전망', sea_view:'🌊 바다 전망', quiet:'🔇 조용한 자리',
    near_exit:'🚪 출입구 인접', window:'🪟 창측', aisle:'↔ 통로측',
    power_outlet:'🔌 콘센트', wheelchair:'♿ 휠체어', noisy:'🔊 소음 주의'
  };
  const tagHtml = tags.map(t => `<span class="tag">${tagMap[t] || t}</span>`).join('');

  document.getElementById('seatInfo').innerHTML = `
    <div class="seat-info-title">
      ${row}열 ${col}석
      <span class="seat-info-badge" style="background:${bg};color:${color}">${typeLabel[type] || type}</span>
    </div>
    <div class="seat-info-note">${title ? `<strong>${title}</strong><br>` : ''}${note || '특이사항 없는 일반 지정석입니다.'}</div>
    ${tagHtml ? `<div class="seat-info-tags">${tagHtml}</div>` : ''}
  `;
}

function renderRecommendations(recs) {
  if (!recs || recs.length === 0) return;
  const html = recs.map(r => `
    <div class="rec-card">
      <div class="rec-card-title">⭐ ${r.title?.ko || ''}</div>
      <div class="rec-card-desc">${r.description?.translations?.ko || ''}</div>
    </div>
  `).join('');
  document.getElementById('recommendations').innerHTML = `
    <div class="rec-title">좌석 추천</div>${html}
  `;
}

async function init() {
  try {
    const res = await fetch(`data/services/${trainId}.json`);
    trainData = await res.json();

    document.getElementById('trainName').textContent = trainData.display_name?.ko || trainId;
    document.getElementById('trainSub').textContent  =
      `${trainData.series} · ${trainData.voiture_formation?.standard_cars || '-'}량 편성 · ${trainData.service_info?.translations?.ko || ''}`;
    document.getElementById('trainCategory').textContent =
      trainData.category === 'shinkansen' ? '신칸센' : '특급';
    document.getElementById('dirLeft').textContent  = `← ${trainData.direction?.car_1_toward?.translations?.ko || ''}`;
    document.getElementById('dirRight').textContent = `${trainData.direction?.last_car_toward?.translations?.ko || ''} →`;

    renderCars(trainData.cars, trainData.cars[0].number);
    renderSeatPanel(trainData.cars[0]);
    renderRecommendations(trainData.seat_recommendations);
  } catch(e) {
    document.getElementById('seatPanel').innerHTML = `
      <div class="loading">데이터를 불러오지 못했어요.<br><small style="color:#bbb">${e.message}</small></div>
    `;
  }
}

init();
</script>
</body>
</html>
