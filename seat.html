<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>좌석 배치도 — RailLog</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1a1a1a; overflow: hidden; height: 100vh; }

    .layout { display: flex; height: 100vh; }

    /* 지도 */
    #map { flex: 1; height: 100vh; }

    /* 상단 네비 */
    .top-nav { position: absolute; top: 16px; left: 16px; z-index: 100; display: flex; gap: 8px; }
    .nav-btn { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(0,0,0,0.1); border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; color: #1a1a1a; transition: all .15s; text-decoration: none; display: flex; align-items: center; gap: 5px; }
    .nav-btn:hover { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .nav-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }

    /* 오른쪽 좌석 배치도 패널 */
    .seat-panel-wrap {
      width: 380px;
      flex-shrink: 0;
      height: 100vh;
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: -4px 0 24px rgba(0,0,0,0.07);
      z-index: 10;
    }

    /* 패널 헤더 */
    .panel-header { padding: 16px 18px 12px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .train-name { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
    .train-sub { font-size: 11px; color: #888; margin-bottom: 10px; }
    .header-badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #E6F1FB; color: #0C447C; }

    /* 차량 선택 */
    .cars-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 10px 18px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .cars-scroll::-webkit-scrollbar { height: 3px; }
    .cars-scroll::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
    .car-btn { flex-shrink: 0; min-width: 58px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; text-align: center; font-size: 11px; transition: all .15s; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .car-btn:hover { border-color: #185FA5; background: #f5f9ff; }
    .car-btn.active { border-color: #185FA5; background: #E6F1FB; font-weight: 500; }
    .car-btn.active.green-car { border-color: #3B6D11; background: #EAF3DE; }
    .car-btn-num { font-weight: 600; font-size: 12px; }
    .car-btn-type { font-size: 10px; color: #888; }
    .car-btn.active .car-btn-type { color: #185FA5; }
    .car-btn.active.green-car .car-btn-type { color: #3B6D11; }
    .car-dots { display: flex; gap: 1px; flex-wrap: wrap; justify-content: center; max-width: 40px; }
    .car-dot { width: 4px; height: 3px; border-radius: 1px; background: #e0e0e0; }
    .car-dot.g { background: #97C459; }
    .car-dot.p { background: #AFA9EC; }
    .car-dot.b { background: #F09595; }
    .car-dot.n { background: #c8d8f0; }

    /* 방향 표시 */
    .direction-bar { display: flex; justify-content: space-between; font-size: 10px; color: #bbb; padding: 6px 18px 0; }

    /* 좌석 배치 영역 */
    .panel-body { flex: 1; overflow-y: auto; padding: 10px 18px 16px; }
    .panel-body::-webkit-scrollbar { width: 3px; }
    .panel-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .car-info-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .car-title { font-size: 14px; font-weight: 600; }
    .class-badge { font-size: 10px; padding: 2px 7px; border-radius: 8px; }
    .badge-ordinary_reserved { background: #E6F1FB; color: #0C447C; }
    .badge-non_reserved { background: #FFF3E0; color: #7A4000; }
    .badge-green { background: #EAF3DE; color: #27500A; }
    .car-meta { font-size: 11px; color: #888; margin-bottom: 12px; }

    .col-labels { display: flex; padding-left: 20px; margin-bottom: 3px; }
    .col-label { width: 28px; text-align: center; font-size: 10px; color: #bbb; margin: 0 2px; }
    .col-aisle { width: 12px; }

    .seat-grid { display: flex; flex-direction: column; gap: 3px; }
    .seat-row { display: flex; align-items: center; }
    .row-num { width: 18px; font-size: 9px; color: #ccc; text-align: right; padding-right: 2px; flex-shrink: 0; }
    .aisle { width: 12px; flex-shrink: 0; }
    .seat-empty { width: 28px; height: 24px; margin: 0 2px; flex-shrink: 0; }
    .seat { width: 28px; height: 24px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 500; transition: transform .1s; margin: 0 2px; flex-shrink: 0; }
    .seat:hover { transform: scale(1.12); }
    .seat.recommend { background: #EAF3DE; color: #27500A; border-color: #97C459; }
    .seat.avoid     { background: #FCEBEB; color: #791F1F; border-color: #F09595; }
    .seat.priority  { background: #EEEDFE; color: #3C3489; border-color: #AFA9EC; }
    .seat.special   { background: #E0F4FF; color: #0C4A6E; border-color: #7DD3FC; }
    .seat.view      { background: #FFF8E1; color: #7A5800; border-color: #FFD54F; }
    .seat.normal    { background: #F5F5F5; color: #888;    border-color: #E0E0E0; }
    .seat.selected  { outline: 2px solid #185FA5; outline-offset: 1px; }

    /* 좌석 정보 */
    .seat-info { margin-top: 12px; padding: 12px; background: #F8F9FA; border-radius: 8px; min-height: 52px; }
    .seat-info-title { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
    .seat-info-badge { font-size: 10px; padding: 1px 6px; border-radius: 6px; }
    .seat-info-note { font-size: 12px; color: #555; line-height: 1.6; }
    .seat-info-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .tag { font-size: 10px; padding: 2px 6px; border-radius: 5px; background: #eee; color: #666; }

    /* 편의시설 */
    .facilities { display: flex; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; flex-wrap: wrap; }
    .fac { font-size: 11px; color: #666; display: flex; align-items: center; gap: 3px; padding: 2px 7px; background: #f8f9fa; border-radius: 5px; border: 1px solid #eee; }

    /* 범례 */
    .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px; border-top: 1px solid #f0f0f0; flex-shrink: 0; background: rgba(255,255,255,0.93); }
    .leg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #666; }
    .leg-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

    .loading { text-align: center; padding: 40px 0; color: #888; font-size: 13px; }
  </style>
</head>
<body>

<div class="layout">
  <!-- 지도 -->
  <div style="flex:1;position:relative">
    <div id="map"></div>
    <div class="top-nav">
      <a href="index.html" class="nav-btn">← 지도로</a>
      <span class="nav-btn active">💺 좌석 배치도</span>
    </div>
  </div>

  <!-- 오른쪽 좌석 배치도 패널 -->
  <div class="seat-panel-wrap">
    <div class="panel-header">
      <div class="train-name" id="trainName">불러오는 중...</div>
      <div class="train-sub" id="trainSub"></div>
      <span class="header-badge" id="trainCategory"></span>
    </div>

    <div class="cars-scroll" id="carsScroll"></div>

    <div class="direction-bar">
      <span id="dirLeft">←</span>
      <span id="dirRight">→</span>
    </div>

    <div class="panel-body">
      <div id="seatPanel"><div class="loading">불러오는 중...</div></div>
    </div>

    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#EAF3DE;border:1px solid #97C459"></div>추천</div>
      <div class="leg"><div class="leg-dot" style="background:#FCEBEB;border:1px solid #F09595"></div>비추천</div>
      <div class="leg"><div class="leg-dot" style="background:#EEEDFE;border:1px solid #AFA9EC"></div>우선석</div>
      <div class="leg"><div class="leg-dot" style="background:#E0F4FF;border:1px solid #7DD3FC"></div>특수석</div>
      <div class="leg"><div class="leg-dot" style="background:#FFF8E1;border:1px solid #FFD54F"></div>전망석</div>
      <div class="leg"><div class="leg-dot" style="background:#F5F5F5;border:1px solid #E0E0E0"></div>일반석</div>
    </div>
  </div>
</div>

<script>




// ★ 여기에 본인 Mapbox 토큰 붙여넣기 ★
mapboxgl.accessToken = 'pk.eyJ1IjoiY2xldmVyZmVuYmVyIiwiYSI6ImNtcDM3b2VnNTBvZXIycm9vNXU4Zmhwd2EifQ.-YB8j8f_f1jIH1Pg6jRMlA';






const params  = new URLSearchParams(location.search);
const trainId = params.get('id') || 'shin_komachi';
let trainData = null;
let lineData  = null;
let selectedEl = null;
let map;

// ── 지도 초기화 ──
function initMap() {
  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/light-v11',
    center: [133.0, 36.0],
    zoom: 5
  });
  map.addControl(new mapboxgl.NavigationControl(), 'top-right');
}

// ── 노선 지도에 표시 ──
async function drawRoute(line) {
  if (!line || !line.dataFile) return;

  map.on('load', async () => {
    try {
      const res = await fetch(line.dataFile);
      const geojson = await res.json();

      map.addSource('route', { type: 'geojson', data: geojson });
      map.addLayer({
        id: 'route-layer',
        type: 'line',
        source: 'route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': line.color || '#185FA5', 'line-width': 4, 'line-opacity': 0.85 }
      });

      // 노선 범위로 지도 이동
      if (line.stationsFile) {
        const stRes = await fetch(line.stationsFile);
        const stData = await stRes.json();
        if (stData.stations && stData.stations.length > 0) {
          const coords = stData.stations.map(s => s.coords);
          const bounds = coords.reduce(
            (b, c) => b.extend(c),
            new mapboxgl.LngLatBounds(coords[0], coords[0])
          );
          map.fitBounds(bounds, { padding: 60, duration: 800 });

          // 역 마커
          stData.stations.forEach(st => {
            const el = document.createElement('div');
            el.style.cssText = `width:7px;height:7px;border-radius:50%;background:#fff;border:2px solid ${line.color || '#185FA5'};cursor:pointer`;
            new mapboxgl.Marker({ element: el })
              .setLngLat(st.coords)
              .setPopup(new mapboxgl.Popup({ offset: 10 }).setHTML(
                `<div style="font-size:12px;font-weight:600">${st.name}</div>
                 <div style="font-size:11px;color:#888">${st.nameJa} · ${st.km}km</div>`
              ))
              .addTo(map);
          });
        }
      }
    } catch(e) {
      console.warn('노선 데이터 로드 실패:', e);
    }
  });
}

// ── 좌석 배치도 ──
function buildSeatMap(car) {
  const map = {};
  (car.seat_notes || []).forEach(note => {
    note.rows.forEach(r => {
      note.cols.forEach(c => {
        map[`${r}-${c}`] = {
          type:  note.type,
          title: note.title?.ko || '',
          note:  note.note?.translations?.ko || '',
          tags:  note.tags || []
        };
      });
    });
  });
  return map;
}

function dotClass(type) {
  return { recommend:'g', avoid:'b', priority:'p', special:'p', view:'g', normal:'n' }[type] || 'n';
}

function getColStructure(layout) {
  const layouts = {
    '2+2': ['A', 'B', 'aisle', 'C', 'D'],
    '2+3': ['A', 'B', 'aisle', 'C', 'D', 'E'],
    '1+2': ['A', 'aisle', 'B', 'C'],
    '2+1': ['A', 'B', 'aisle', 'C'],
    '3+2': ['A', 'B', 'C', 'aisle', 'D', 'E'],
    '1+1': ['A', 'aisle', 'B']
  };
  return layouts[layout] || null;
}

function renderCars(cars, activeNum) {
  const html = cars.map(car => {
    const classId = car.class_id || 'ordinary_reserved';
    const isGreen = classId === 'green';
    const label   = { ordinary_reserved:'지정석', non_reserved:'자유석', green:'그린카' }[classId] || classId;
    const seatMap = buildSeatMap(car);

    const dotSample = [];
    if (car.seat_rows > 0) {
      for (let r = 1; r <= Math.min(car.seat_rows, 3); r++) {
        (car.seat_columns || ['A','B','C','D']).forEach(c => {
          const info = seatMap[`${r}-${c}`];
          dotSample.push(`<div class="car-dot ${info ? dotClass(info.type) : 'n'}"></div>`);
        });
      }
    }

    return `<button class="car-btn${isGreen ? ' green-car' : ''}${car.number === activeNum ? ' active' : ''}"
      onclick="selectCar(${car.number})">
      <div class="car-btn-num">${car.number}호차</div>
      <div class="car-dots">${dotSample.join('')}</div>
      <div class="car-btn-type">${label}</div>
    </button>`;
  });
  document.getElementById('carsScroll').innerHTML = html.join('');
}

function selectCar(num) {
  const car = trainData.cars.find(c => c.number === num);
  if (!car) return;
  renderCars(trainData.cars, num);
  renderSeatPanel(car);
}

function renderSeatPanel(car) {
  const seatMap   = buildSeatMap(car);
  const classId   = car.class_id || 'ordinary_reserved';
  const classInfo = (trainData.seat_classes || []).find(sc => sc.id === classId) || {};
  const label     = classInfo.display_name?.ko || classId;
  const pitch     = classInfo.pitch_mm ? classInfo.pitch_mm + 'mm' : '-';

  const seatMap2d = car.seat_map && car.seat_map.length > 0
    ? car.seat_map
    : Array(car.seat_rows || 1).fill(['A', 'B', 'aisle', 'C', 'D']);

  const layoutCols = getColStructure(classInfo.layout);
  const labelRow = layoutCols || seatMap2d.reduce((best, row) => {
    const count = row.filter(c => c !== 'aisle' && c !== 'empty').length;
    const bestCount = best.filter(c => c !== 'aisle' && c !== 'empty').length;
    return count > bestCount ? row : best;
  }, seatMap2d[0]);

  let colLabels = '<div class="col-labels"><div style="width:20px"></div>';
  labelRow.forEach(cell => {
    if (cell === 'aisle') {
      colLabels += '<div class="col-aisle"></div>';
    } else if (cell === 'empty') {
      colLabels += '<div class="col-label"></div>';
    } else {
      colLabels += `<div class="col-label">${cell}</div>`;
    }
  });
  colLabels += '</div>';

  let grid = '<div class="seat-grid">';
  seatMap2d.forEach((rowDef, rowIdx) => {
    const r = rowIdx + 1;
    grid += '<div class="seat-row">';
    grid += `<div class="row-num">${r}</div>`;
    rowDef.forEach(cell => {
      if (cell === 'aisle') {
        grid += '<div class="aisle"></div>';
      } else if (cell === 'empty') {
        grid += '<div class="seat-empty"></div>';
      } else {
        const key  = `${r}-${cell}`;
        const info = seatMap[key] || { type: 'normal', title: '', note: '', tags: [] };
        const dataNote  = (info.note  || '').replace(/"/g, '&quot;');
        const dataTitle = (info.title || '').replace(/"/g, '&quot;');
        const dataTags  = JSON.stringify(info.tags || []).replace(/"/g, '&quot;');
        grid += `<div class="seat ${info.type}" id="seat-${r}-${cell}"
          data-row="${r}" data-col="${cell}" data-type="${info.type}"
          data-title="${dataTitle}" data-note="${dataNote}" data-tags="${dataTags}"
          onclick="selectSeat(this)">${r}${cell}</div>`;
      }
    });
    grid += '</div>';
  });
  grid += '</div>';

  const f = car.facilities || {};
  const facs = [];
  if (f.toilet)             facs.push({ icon:'🚻', label:'화장실' });
  if (f.toilet_for_man)     facs.push({ icon:'🚹', label:'남성화장실' });
  if (f.washroom)           facs.push({ icon:'🚿', label:'세면대' });
  if (f.handwash)           facs.push({ icon:'🧴', label:'손세면대' });
  if (f.multi_purpose_room) facs.push({ icon:'♿', label:'다목적실' });
  if (f.wheelchair_space)   facs.push({ icon:'♿', label:'휠체어' });
  if (f.power_outlet)       facs.push({ icon:'🔌', label:'콘센트' });
  if (f.wifi)               facs.push({ icon:'📶', label:'Wi-Fi' });
  if (f.vending_machine)    facs.push({ icon:'🥤', label:'자판기' });
  if (f.smoking_room)       facs.push({ icon:'🚬', label:'흡연실' });
  if (f.AED)                facs.push({ icon:'❤️‍🩹', label:'AED' });
  if (f.conductor_room)     facs.push({ icon:'👨‍✈️', label:'차장실' });
  if (f.luggage_area && f.luggage_area !== 'none') facs.push({ icon:'🧳', label:'짐칸' });

  const badgeClass = {
    ordinary_reserved: 'badge-ordinary_reserved',
    non_reserved:      'badge-non_reserved',
    green:             'badge-green'
  }[classId] || 'badge-ordinary_reserved';

  document.getElementById('seatPanel').innerHTML = `
    <div class="car-info-bar">
      <span class="car-title">${car.number}호차</span>
      <span class="class-badge ${badgeClass}">${label}</span>
    </div>
    <div class="car-meta">좌석 피치 ${pitch} · ${car.capacity || '-'}석</div>
    ${colLabels}
    ${grid}
    <div class="seat-info" id="seatInfo">
      <span style="color:#bbb;font-size:12px">좌석을 클릭하면 상세 정보가 표시됩니다</span>
    </div>
    <div class="facilities">${facs.map(f => `<div class="fac">${f.icon} ${f.label}</div>`).join('')}</div>
  `;
}

function selectSeat(el) {
  if (selectedEl) selectedEl.classList.remove('selected');
  selectedEl = el;
  el.classList.add('selected');

  const row   = el.dataset.row;
  const col   = el.dataset.col;
  const type  = el.dataset.type;
  const title = el.dataset.title;
  const note  = el.dataset.note;
  let tags = [];
  try { tags = JSON.parse(el.dataset.tags.replace(/&quot;/g, '"')); } catch(e) {}

  const typeLabel = { recommend:'추천석', avoid:'비추천석', priority:'우선석', special:'특수석', view:'전망석', normal:'일반석' };
  const typeBg    = {
    recommend: ['#EAF3DE', '#27500A'],
    avoid:     ['#FCEBEB', '#791F1F'],
    priority:  ['#EEEDFE', '#3C3489'],
    special:   ['#E0F4FF', '#0C4A6E'],
    view:      ['#FFF8E1', '#7A5800'],
    normal:    ['#F5F5F5', '#888']
  };
  const [bg, color] = typeBg[type] || ['#F5F5F5', '#888'];

  const tagMap = {
    mountain_view:'🏔 산 전망', sea_view:'🌊 바다 전망', quiet:'🔇 조용',
    near_exit:'🚪 출입구 인접', window:'🪟 창측', aisle:'↔ 통로측',
    power_outlet:'🔌 콘센트', wheelchair:'♿ 휠체어', noisy:'🔊 소음 주의'
  };
  const tagHtml = tags.map(t => `<span class="tag">${tagMap[t] || t}</span>`).join('');

  document.getElementById('seatInfo').innerHTML = `
    <div class="seat-info-title">
      ${row}열 ${col}석
      <span class="seat-info-badge" style="background:${bg};color:${color}">${typeLabel[type] || type}</span>
    </div>
    <div class="seat-info-note">${title ? `<strong>${title}</strong><br>` : ''}${note || '특이사항 없는 일반 지정석입니다.'}</div>
    ${tagHtml ? `<div class="seat-info-tags">${tagHtml}</div>` : ''}
  `;
}

// ── 메인 초기화 ──
async function init() {
  initMap();

  try {
    // 서비스 파일 로드
    const res = await fetch(`data/services/${trainId}.json`);
    trainData = await res.json();

    // 헤더 설정
    document.getElementById('trainName').textContent = trainData.display_name?.ko || trainId;
    document.getElementById('trainSub').textContent  =
      `${trainData.series} · ${trainData.voiture_formation?.standard_cars || '-'}량 편성 · ${trainData.service_info?.translations?.ko || ''}`;
    document.getElementById('trainCategory').textContent =
      trainData.category === 'shinkansen' ? '신칸센' : '특급';
    document.getElementById('dirLeft').textContent  = `← ${trainData.direction?.car_1_toward?.translations?.ko || ''}`;
    document.getElementById('dirRight').textContent = `${trainData.direction?.last_car_toward?.translations?.ko || ''} →`;

    // 노선 데이터 로드 → 지도에 표시
    if (trainData.routes && trainData.routes.length > 0) {
      const lineId = trainData.routes[0].line_id;
      try {
        const lineRes = await fetch(`data/lines/${lineId}.json`);
        lineData = await lineRes.json();
        drawRoute(lineData);
      } catch(e) {
        console.warn('lines 파일 로드 실패:', e);
      }
    }

    // 좌석 배치도
    renderCars(trainData.cars, trainData.cars[0].number);
    renderSeatPanel(trainData.cars[0]);

  } catch(e) {
    document.getElementById('seatPanel').innerHTML = `
      <div class="loading">데이터를 불러오지 못했어요.<br><small style="color:#bbb">${e.message}</small></div>
    `;
  }
}

init();
</script>
</body>
</html>
