<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>좌석 배치도 — JR 좌석 가이드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #1a1a1a; }

    header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 13px; color: #185FA5; text-decoration: none; padding: 4px 0; }
    .back-btn:hover { text-decoration: underline; }
    header h1 { font-size: 16px; font-weight: 600; }
    header .sub { font-size: 12px; color: #888; }

    .container { max-width: 780px; margin: 0 auto; padding: 20px 16px; }

    /* 차량 선택 */
    .cars-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .cars-scroll::-webkit-scrollbar { height: 4px; }
    .cars-scroll::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
    .car-btn { flex-shrink: 0; padding: 8px 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; text-align: center; font-size: 13px; transition: all .15s; }
    .car-btn:hover { border-color: #185FA5; }
    .car-btn.active { border-color: #185FA5; background: #E6F1FB; font-weight: 500; }
    .car-btn.green-car.active { border-color: #3B6D11; background: #EAF3DE; }
    .car-btn-num { font-weight: 500; }
    .car-btn-type { font-size: 11px; color: #888; margin-top: 2px; }
    .car-btn.active .car-btn-type { color: #185FA5; }
    .car-btn.green-car.active .car-btn-type { color: #3B6D11; }

    /* 방향 표시 */
    .direction-bar { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 6px; }

    /* 좌석 배치 영역 */
    .seat-panel { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; }
    .seat-panel-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .seat-panel-title { font-size: 15px; font-weight: 500; }
    .class-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .badge-ordinary { background: #E6F1FB; color: #0C447C; }
    .badge-green { background: #EAF3DE; color: #27500A; }
    .seat-panel-meta { font-size: 12px; color: #888; margin-bottom: 16px; }

    .col-labels { display: flex; padding-left: 24px; margin-bottom: 4px; gap: 0; }
    .col-label { width: 32px; text-align: center; font-size: 11px; color: #aaa; margin: 0 2px; }
    .col-aisle { width: 16px; }

    .seat-grid { display: flex; flex-direction: column; gap: 4px; }
    .seat-row { display: flex; align-items: center; }
    .row-num { width: 20px; font-size: 10px; color: #bbb; text-align: right; padding-right: 4px; flex-shrink: 0; }
    .aisle { width: 16px; flex-shrink: 0; }
    .seat { width: 32px; height: 28px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; transition: transform .1s; margin: 0 2px; flex-shrink: 0; }
    .seat:hover { transform: scale(1.1); }
    .seat.recommend  { background: #EAF3DE; color: #27500A; border-color: #97C459; }
    .seat.avoid      { background: #FCEBEB; color: #791F1F; border-color: #F09595; }
    .seat.priority   { background: #EEEDFE; color: #3C3489; border-color: #AFA9EC; }
    .seat.special    { background: #E0F4FF; color: #0C4A6E; border-color: #7DD3FC; }
    .seat.normal     { background: #F5F5F5; color: #888; border-color: #E0E0E0; }
    .seat.selected   { outline: 2px solid #185FA5; outline-offset: 1px; }

    /* 선택된 좌석 정보 */
    .seat-info { margin-top: 16px; padding: 14px; background: #F8F9FA; border-radius: 8px; font-size: 13px; color: #555; min-height: 52px; }
    .seat-info-title { font-size: 14px; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; }
    .seat-info-type { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }

    /* 편의시설 */
    .facilities { display: flex; gap: 14px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee; flex-wrap: wrap; }
    .fac { font-size: 12px; color: #666; }

    /* 범례 */
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; }
    .leg-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  </style>
</head>
<body>

<header>
  <a class="back-btn" href="index.html">← 목록으로</a>
  <div>
    <h1 id="trainName">불러오는 중...</h1>
    <div class="sub" id="trainSub"></div>
  </div>
</header>

<div class="container">
  <div class="direction-bar">
    <span id="dirLeft">←</span>
    <span id="dirRight">→</span>
  </div>
  <div class="cars-scroll" id="carsScroll"></div>
  <div class="seat-panel" id="seatPanel"></div>
  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:#EAF3DE;border:1px solid #97C459"></div>추천석</div>
    <div class="leg"><div class="leg-dot" style="background:#FCEBEB;border:1px solid #F09595"></div>비추천석</div>
    <div class="leg"><div class="leg-dot" style="background:#EEEDFE;border:1px solid #AFA9EC"></div>우선석</div>
    <div class="leg"><div class="leg-dot" style="background:#E0F4FF;border:1px solid #7DD3FC"></div>특수석</div>
    <div class="leg"><div class="leg-dot" style="background:#F5F5F5;border:1px solid #E0E0E0"></div>일반석</div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const trainId = params.get('id');
let trainData = null;
let selectedEl = null;

// 좌석별 타입 맵 만들기
function buildSeatMap(car) {
  const map = {};
  (car.seat_notes || []).forEach(note => {
    note.rows.forEach(r => {
      note.cols.forEach(c => {
        map[`${r}-${c}`] = { type: note.type, note_ko: note.note_ko };
      });
    });
  });
  return map;
}

function renderCars(cars, activeNum) {
  const classLabel = { ordinary: '보통차', green: '그린차' };
  document.getElementById('carsScroll').innerHTML = cars.map(car => `
    <button class="car-btn ${car.class === 'green' ? 'green-car' : ''} ${car.number === activeNum ? 'active' : ''}"
      onclick="selectCar(${car.number})">
      <div class="car-btn-num">${car.number}호차</div>
      <div class="car-btn-type">${classLabel[car.class] || car.class}</div>
    </button>
  `).join('');
}

function selectCar(num) {
  const car = trainData.cars.find(c => c.number === num);
  renderCars(trainData.cars, num);
  renderSeatPanel(car);
}

function renderSeatPanel(car) {
  const seatMap = buildSeatMap(car);
  const classLabel = { ordinary: '보통차', green: '그린차' };
  const classKey = car.class === 'green' ? 'green' : 'ordinary';
  const classInfo = trainData.seat_classes.find(sc => sc.id === classKey) || {};

  const typeLabel = { recommend: '추천석', avoid: '비추천석', priority: '우선석', special: '특수석', normal: '일반석' };

  // 열 라벨
  let colLabels = '<div class="col-labels"><div style="width:4px"></div>';
  car.seat_columns.forEach((col, i) => {
    if (i === 2) colLabels += '<div class="col-aisle"></div>';
    colLabels += `<div class="col-label">${col}</div>`;
  });
  colLabels += '</div>';

  // 좌석 그리드
  let grid = '<div class="seat-grid">';
  for (let r = 1; r <= car.seat_rows; r++) {
    grid += '<div class="seat-row">';
    grid += `<div class="row-num">${r}</div>`;
    car.seat_columns.forEach((col, i) => {
      if (i === 2) grid += '<div class="aisle"></div>';
      const key = `${r}-${col}`;
      const info = seatMap[key] || { type: 'normal', note_ko: '' };
      grid += `<div class="seat ${info.type}" id="seat-${r}-${col}"
        data-row="${r}" data-col="${col}" data-type="${info.type}" data-note="${info.note_ko}"
        onclick="selectSeat(this)">${r}${col}</div>`;
    });
    grid += '</div>';
  }
  grid += '</div>';

  // 편의시설
  const facs = [];
  if (car.facilities.toilet) facs.push('🚻 화장실');
  if (car.facilities.multi_purpose_room) facs.push('♿ 다목적실');
  if (car.facilities.luggage_area !== 'none') facs.push('🧳 잠금식 짐칸');
  if (classInfo.features) classInfo.features.forEach(f => {
    if (!facs.some(x => x.includes(f))) facs.push('✓ ' + f);
  });

  document.getElementById('seatPanel').innerHTML = `
    <div class="seat-panel-header">
      <span class="seat-panel-title">${car.number}호차</span>
      <span class="class-badge badge-${car.class === 'green' ? 'green' : 'ordinary'}">${classLabel[car.class]}</span>
    </div>
    <div class="seat-panel-meta">좌석 피치 ${classInfo.pitch_mm ? classInfo.pitch_mm + 'mm' : '-'} · ${car.capacity}석</div>
    ${colLabels}
    ${grid}
    <div class="seat-info" id="seatInfo">
      <span style="color:#aaa">좌석을 클릭하면 상세 정보가 표시됩니다</span>
    </div>
    <div class="facilities">${facs.map(f => `<div class="fac">${f}</div>`).join('')}</div>
  `;
}

function selectSeat(el) {
  if (selectedEl) selectedEl.classList.remove('selected');
  selectedEl = el;
  el.classList.add('selected');

  const row = el.dataset.row, col = el.dataset.col;
  const type = el.dataset.type;
  const note = el.dataset.note;
  const typeLabel = { recommend: '추천석', avoid: '비추천석', priority: '우선석', special: '특수석', normal: '일반석' };
  const typeColor = { recommend: '#EAF3DE;color:#27500A', avoid: '#FCEBEB;color:#791F1F', priority: '#EEEDFE;color:#3C3489', special: '#E0F4FF;color:#0C4A6E', normal: '#F5F5F5;color:#888' };

  document.getElementById('seatInfo').innerHTML = `
    <div class="seat-info-title">${row}열 ${col}석
      <span class="seat-info-type" style="background:${(typeColor[type]||'').split(';')[0]};${(typeColor[type]||'').split(';')[1]}">${typeLabel[type]||type}</span>
    </div>
    <div>${note || '특이사항 없는 일반 지정석입니다.'}</div>
  `;
}

async function init() {
  const res = await fetch(`data/seats/${trainId}.json`);
  trainData = await res.json();

  document.getElementById('trainName').textContent = trainData.name_ko;
  document.getElementById('trainSub').textContent = `${trainData.series} · ${trainData.formation.standard_cars}량 편성`;
  document.getElementById('dirLeft').textContent = `← ${trainData.direction.car_1_toward}`;
  document.getElementById('dirRight').textContent = `${trainData.direction.last_car_toward} →`;

  renderCars(trainData.cars, 1);
  renderSeatPanel(trainData.cars[0]);
}

init();
</script>
</body>
</html>
