<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrohopper</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1a1a1a; overflow: hidden; height: 100vh; }

    /* 전체 레이아웃 */
    .layout { display: flex; height: 100vh; position: relative; }

    /* 지도 */
    #map { flex: 1; height: 100vh; }

    /* 오른쪽 플로팅 패널 */
    .panel {
      width: 320px;
      flex-shrink: 0;
      height: 100vh;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: -4px 0 24px rgba(0,0,0,0.06);
      z-index: 10;
    }

    /* 패널 헤더 */
    .panel-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .user-greeting {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.2;
    }
    .user-greeting span {
      color: #185FA5;
    }
    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #185FA5, #3B9AE1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
      cursor: pointer;
      overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* 통계 */
    .stats-row {
      display: flex;
      gap: 0;
      background: #f8f9fa;
      border-radius: 10px;
      overflow: hidden;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      border-right: 1px solid #eee;
    }
    .stat:last-child { border-right: none; }
    .stat-num { font-size: 17px; font-weight: 700; color: #185FA5; }
    .stat-label { font-size: 10px; color: #888; margin-top: 1px; }

    /* 패널 바디 */
    .panel-body { flex: 1; overflow-y: auto; padding: 0 0 16px; }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    /* 섹션 */
    .section-label {
      padding: 14px 20px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: .08em;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
    }

    /* 노선 아이템 */
    .route-item {
      padding: 10px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background .12s;
      border-left: 3px solid transparent;
    }
    .route-item:hover { background: #f5f8ff; }
    .route-item.active { background: #EEF5FF; border-left-color: #185FA5; }
    .route-item.unridden { opacity: .45; }
    .r-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .r-info { flex: 1; min-width: 0; }
    .r-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-meta { font-size: 11px; color: #888; margin-top: 2px; }
    .r-date { font-size: 10px; color: #bbb; margin-top: 1px; }
    .r-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .divider { height: 1px; background: #f0f0f0; margin: 6px 20px; }

    /* 지도 위 팝업 */
    .popup-box {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 14px;
      padding: 14px 16px;
      min-width: 280px;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.14);
      display: none;
    }
    .popup-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
    .popup-name { font-size: 15px; font-weight: 700; }
    .popup-close { cursor: pointer; color: #aaa; font-size: 20px; line-height: 1; background: none; border: none; padding: 0; }
    .popup-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px; margin-bottom: 6px; }
    .popup-route { font-size: 12px; color: #555; margin-bottom: 4px; }
    .popup-note { font-size: 12px; color: #888; }

    /* 범례 */
    .legend-box {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 100;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #555; margin-bottom: 4px; }
    .leg:last-child { margin-bottom: 0; }
    .leg-line { width: 20px; height: 3px; border-radius: 1px; flex-shrink: 0; }

    /* 상단 네비 */
    .top-nav {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: #1a1a1a;
      transition: all .15s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nav-btn:hover { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .nav-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  </style>
</head>
<body>

<div class="layout">
  <!-- 지도 -->
  <div style="flex:1;position:relative">
    <div id="map"></div>

    <!-- 상단 네비 -->
    <div class="top-nav">
      <span class="nav-btn active">🗺 지도</span>
      <a href="index_list.html" class="nav-btn">🚄 열차 목록</a>
      <a href="seat.html" class="nav-btn">💺 좌석 배치도</a>
    </div>

    <!-- 노선 클릭 팝업 -->
    <div class="popup-box" id="popupBox">
      <div class="popup-top">
        <div>
          <div class="popup-name" id="popupName"></div>
          <span class="popup-badge" id="popupBadge"></span>
        </div>
        <button class="popup-close" onclick="closePopup()">×</button>
      </div>
      <div class="popup-route" id="popupRoute"></div>
      <div class="popup-note" id="popupNote"></div>
    </div>

    <!-- 범례 -->
    <div class="legend-box">
      <div class="leg"><div class="leg-line" style="background:#185FA5"></div>신칸센 (도카이도·산요)</div>
      <div class="leg"><div class="leg-line" style="background:#E24B4A"></div>신칸센 (도호쿠·아키타)</div>
      <div class="leg"><div class="leg-line" style="background:#BA7517"></div>신칸센 (조에쓰·호쿠리쿠)</div>
      <div class="leg"><div class="leg-line" style="background:#3B6D11"></div>특급</div>
      <div class="leg"><div class="leg-line" style="background:#bbb"></div>미탑승</div>
    </div>
  </div>

  <!-- 오른쪽 플로팅 패널 -->
  <div class="panel">
    <div class="panel-header">
      <div class="user-row">
        <div>
          <div style="font-size:12px;color:#888;margin-bottom:3px">안녕하세요 👋</div>
          <div class="user-greeting">Hi, <span id="userName">Guest</span></div>
        </div>
        <div class="user-avatar" id="userAvatar">G</div>
      </div>
      <div class="stats-row">
        <div class="stat"><div class="stat-num" id="statRoutes">0</div><div class="stat-label">노선</div></div>
        <div class="stat"><div class="stat-num" id="statKm">0</div><div class="stat-label">km</div></div>
        <div class="stat"><div class="stat-num" id="statStations">0</div><div class="stat-label">역</div></div>
      </div>
    </div>

    <div class="panel-body">
      <!-- 예정 노선 -->
      <div class="section-label">예정 노선</div>
      <div id="plannedList"></div>

      <div class="divider"></div>

      <!-- 탑승 완료 -->
      <div class="section-label">탑승 완료</div>
      <div id="riddenList"></div>
    </div>
  </div>
</div>

<script>
// ★ 여기에 본인 Mapbox 토큰 붙여넣기 ★
mapboxgl.accessToken = 'pk.eyJ1IjoiY2xldmVyZmVuYmVyIiwiYSI6ImNtcDM3b2VnNTBvZXIycm9vNXU4Zmhwd2EifQ.-YB8j8f_f1jIH1Pg6jRMlA';


// 임시 유저 데이터 (나중에 로그인 시스템 연동)
const USER = {
  name: 'CleverFenber',
  avatar: null
};

const ROUTES = [
  { id:'tokaido', name:'도카이도 신칸센', nameJa:'東海道新幹線', category:'shinkansen', color:'#185FA5', km:552, ridden:true, date:'2024-03-15', note:'노조미 탑승. 도쿄~신오사카 전 구간.', dataFile:'data/geojson/shinkansen/shin-tokaido.json', stations:['도쿄','나고야','신오사카'] },
  { id:'sanyo', name:'산요 신칸센', nameJa:'山陽新幹線', category:'shinkansen', color:'#185FA5', km:623, ridden:true, date:'2024-03-16', note:'노조미 탑승. 신오사카~하카타.', dataFile:'data/geojson/shinkansen/shin-sanyo.json', stations:['신오사카','히로시마','하카타'] },
  { id:'shin-tohoku', name:'도호쿠 신칸센', nameJa:'東北新幹線', category:'shinkansen', color:'#E24B4A', km:676, ridden:true, date:'2024-05-10', note:'하야부사 탑승. E5계 그린차 경험.', dataFile:'data/geojson/shinkansen/shin-tohoku.json', stations:['도쿄','센다이','신아오모리'] },
  { id:'shin-hokkaido', name:'홋카이도 신칸센', nameJa:'北海道新幹線', category:'shinkansen', color:'#E24B4A', km:149, ridden:true, date:'2024-05-11', note:'H5계 탑승.', dataFile:'data/geojson/shinkansen/shin-hokkaido.json', stations:['신아오모리','신하코다테호쿠토'] },
  { id:'shin-joetsu', name:'조에쓰 신칸센', nameJa:'上越新幹線', category:'shinkansen', color:'#BA7517', km:270, ridden:true, date:'2024-06-02', note:'도키 탑승. E7계.', dataFile:'data/geojson/shinkansen/shin-joetu.json', stations:['도쿄','오미야','니가타'] },
  { id:'shin-hokuriku', name:'호쿠리쿠 신칸센', nameJa:'北陸新幹線', category:'shinkansen', color:'#BA7517', km:450, ridden:false, date:'2025-02-20', note:'미탑승. 예정.', dataFile:'data/geojson/shinkansen/shin-hokuriku.json', stations:['도쿄','나가노','가나자와','쓰루가'] },
  { id:'shin-akita', name:'아키타 신칸센', nameJa:'秋田新幹線', category:'shinkansen', color:'#E24B4A', km:999, ridden:true, date:'2024-07-08', note:'코마치 탑승.', dataFile:'data/geojson/shinkansen/shin-akita-full.json', stations:['도쿄','센다이','모리오카','아키타'] },
  { id:'odoriko', name:'오도리코', nameJa:'踊り子', category:'limited_express', color:'#3B6D11', km:104, ridden:true, date:'2024-04-03', note:'E257계 탑승. 도쿄~이즈.', coords:[[139.7671,35.6812],[138.9312,34.9767]], stations:['도쿄','이즈큐시모다'] },
  { id:'hokuto', name:'호쿠토', nameJa:'北斗', category:'limited_express', color:'#3B6D11', km:319, ridden:true, date:'2024-05-12', note:'키하261계 탑승. 하코다테~삿포로.', coords:[[140.6880,41.9025],[141.3544,43.0621]], stations:['하코다테','삿포로'] },
  { id:'sonic', name:'소닉', nameJa:'ソニック', category:'limited_express', color:'#3B6D11', km:132, ridden:true, date:'2024-03-17', note:'885계 탑승. 하카타~오이타.', coords:[[130.4203,33.5902],[131.6061,33.2383]], stations:['하카타','오이타'] },
  { id:'azusa', name:'아즈사', nameJa:'あずさ', category:'limited_express', color:'#3B6D11', km:227, ridden:true, date:'2024-08-20', note:'E353계 탑승. 신주쿠~마쓰모토.', coords:[[139.6917,35.6895],[137.9720,36.2380]], stations:['신주쿠','마쓰모토'] },
  { id:'shirasagi', name:'시라사기', nameJa:'しらさぎ', category:'limited_express', color:'#3B6D11', km:177, ridden:false, date:'2025-03-10', note:'미탑승. 예정.', coords:[[136.8816,35.1706],[136.6562,36.5613]], stations:['나고야','가나자와'] }
];

let map, activeId = null;

function init() {
  // 유저 정보 설정
  document.getElementById('userName').textContent = USER.name;
  const avatar = document.getElementById('userAvatar');
  if (USER.avatar) {
    avatar.innerHTML = `<img src="${USER.avatar}" alt="${USER.name}">`;
  } else {
    avatar.textContent = USER.name.charAt(0).toUpperCase();
  }

  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [133.0, 38.0], // 한국·일본 한눈에
    zoom: 5.0
  });

  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  map.on('load', async () => {
    for (const r of ROUTES) {
      const sourceId = 'src-' + r.id;
      const layerId  = 'lyr-' + r.id;

      let geojsonData;
      if (r.dataFile) {
        const res = await fetch(r.dataFile);
        geojsonData = await res.json();
      } else {
        geojsonData = {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: r.coords }
        };
      }

      map.addSource(sourceId, { type: 'geojson', data: geojsonData });
      map.addLayer({
        id: layerId,
        type: 'line',
        source: sourceId,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': r.color,
          'line-width': r.ridden ? 4 : 2,
          'line-opacity': r.ridden ? 0.85 : 0.35,
          'line-dasharray': r.ridden ? [1] : [2, 2]
        }
      });

      map.on('mouseenter', layerId, () => {
        map.getCanvas().style.cursor = 'pointer';
        if (activeId !== r.id) map.setPaintProperty(layerId, 'line-width', r.ridden ? 7 : 4);
      });
      map.on('mouseleave', layerId, () => {
        map.getCanvas().style.cursor = '';
        if (activeId !== r.id) map.setPaintProperty(layerId, 'line-width', r.ridden ? 4 : 2);
      });
      map.on('click', layerId, () => showPopup(r));

      if (r.ridden && r.coords) {
        [r.coords[0], r.coords[r.coords.length - 1]].forEach(coord => {
          const el = document.createElement('div');
          el.style.cssText = `width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid ${r.color};cursor:pointer`;
          el.addEventListener('click', () => showPopup(r));
          new mapboxgl.Marker({ element: el }).setLngLat(coord).addTo(map);
        });
      }
    }
  });

  buildPanel();
  updateStats();
}

function buildPanel() {
  const ridden   = ROUTES.filter(r =>  r.ridden).sort((a,b) => new Date(b.date) - new Date(a.date));
  const planned  = ROUTES.filter(r => !r.ridden).sort((a,b) => new Date(a.date) - new Date(b.date));

  const catLabel = { shinkansen: '신칸센', limited_express: '특급' };
  const catBg    = { shinkansen: '#E6F1FB', limited_express: '#EAF3DE' };
  const catColor = { shinkansen: '#0C447C', limited_express: '#27500A' };

  document.getElementById('plannedList').innerHTML =
    planned.length ? planned.map(r => itemHTML(r, catLabel, catBg, catColor)).join('') :
    '<div style="padding:10px 20px;font-size:12px;color:#bbb">예정된 노선이 없어요</div>';

  document.getElementById('riddenList').innerHTML =
    ridden.map(r => itemHTML(r, catLabel, catBg, catColor)).join('');
}

function itemHTML(r, catLabel, catBg, catColor) {
  const dateStr = r.date ? new Date(r.date).toLocaleDateString('ko-KR', { year:'numeric', month:'short', day:'numeric' }) : '';
  return `<div class="route-item${r.ridden ? '' : ' unridden'}" id="ri-${r.id}" onclick='showPopup(${JSON.stringify(r)})'>
    <div class="r-dot" style="background:${r.color}"></div>
    <div class="r-info">
      <div class="r-name">${r.name}</div>
      <div class="r-meta">${r.km}km · ${r.stations[0]} → ${r.stations[r.stations.length-1]}</div>
      <div class="r-date">${r.ridden ? '탑승일 ' : '예정일 '}${dateStr}</div>
    </div>
    <div class="r-badge" style="background:${catBg[r.category]};color:${catColor[r.category]}">${catLabel[r.category]||r.category}</div>
  </div>`;
}

function updateStats() {
  const ridden = ROUTES.filter(r => r.ridden);
  document.getElementById('statRoutes').textContent = ridden.length;
  document.getElementById('statKm').textContent = ridden.reduce((s, r) => s + r.km, 0).toLocaleString();
  document.getElementById('statStations').textContent = [...new Set(ridden.flatMap(r => r.stations))].length;
}

function showPopup(r) {
  if (activeId) {
    const prev = ROUTES.find(x => x.id === activeId);
    if (prev) map.setPaintProperty('lyr-' + activeId, 'line-width', prev.ridden ? 4 : 2);
  }
  activeId = r.id;
  map.setPaintProperty('lyr-' + r.id, 'line-width', r.ridden ? 7 : 4);

  if (r.coords) {
    const bounds = r.coords.reduce((b, c) => b.extend(c), new mapboxgl.LngLatBounds(r.coords[0], r.coords[0]));
    map.fitBounds(bounds, { padding: 100, duration: 800 });
  }

  document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
  const ri = document.getElementById('ri-' + r.id);
  if (ri) { ri.classList.add('active'); ri.scrollIntoView({ block: 'nearest' }); }

  const catLabel   = { shinkansen: '신칸센', limited_express: '특급' };
  const badgeBg    = { shinkansen: '#E6F1FB', limited_express: '#EAF3DE' };
  const badgeColor = { shinkansen: '#0C447C', limited_express: '#27500A' };
  document.getElementById('popupName').textContent  = r.name + '  ' + r.nameJa;
  document.getElementById('popupBadge').textContent = catLabel[r.category];
  document.getElementById('popupBadge').style.cssText = `background:${badgeBg[r.category]};color:${badgeColor[r.category]}`;
  document.getElementById('popupRoute').textContent = r.stations.join(' → ') + ' · ' + r.km + 'km';
  document.getElementById('popupNote').textContent  = r.note;
  document.getElementById('popupBox').style.display = 'block';
}

function closePopup() {
  if (activeId) {
    const prev = ROUTES.find(x => x.id === activeId);
    if (prev) map.setPaintProperty('lyr-' + activeId, 'line-width', prev.ridden ? 4 : 2);
  }
  activeId = null;
  document.getElementById('popupBox').style.display = 'none';
  document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
}

init();
</script>
</body>
</html>
